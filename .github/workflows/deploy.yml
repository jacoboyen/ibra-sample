name: Build and deploy

on:
  push:
    branches: [main]
  # Daily at 10:17 UTC (4:17am CST / 5:17am CDT): pull the latest Google Calendar
  # and BikeReg data and redeploy. GitHub may start scheduled runs a few minutes late.
  schedule:
    - cron: "17 10 * * *"
  # "Run workflow" button on the Actions tab: refresh the site right now.
  workflow_dispatch:

permissions:
  contents: write   # save season data back to the repo
  pages: write
  id-token: write
  issues: write     # open an issue when the calendar and BikeReg disagree

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}

      # Saving season data keeps past seasons intact and, together with the monthly
      # heartbeat file, keeps the repo active so GitHub never pauses this schedule.
      - name: Save season data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update race data"
            git pull --rebase --quiet
            git push
          fi

      - name: Report calendar problems
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label "calendar-sync" --state open --json number --jq '.[0].number')
          if [ -s .cache/sync-report.md ]; then
            if [ -z "$open" ]; then
              gh label create calendar-sync --color FFCD00 --description "Automatic calendar/BikeReg check" 2>/dev/null || true
              gh issue create --label calendar-sync --title "Race calendar needs a look" --body-file .cache/sync-report.md
            else
              gh issue edit "$open" --body-file .cache/sync-report.md
            fi
          elif [ -n "$open" ]; then
            # Nothing to report any more: close the issue so it doesn't linger.
            gh issue close "$open" --comment "The latest build found no calendar problems, so this is resolved."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Finds the merged pull request this run deploys. The accessibility and Lighthouse
  # checks only run when there is one, so scheduled runs, manual runs and Pages CMS
  # edits (which commit straight to main) skip them.
  merged-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.find.outputs.number }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          number=""
          if [ "$EVENT" = "push" ]; then
            number=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then echo "Deploying merged pull request #$number: post-deploy checks will run."; else echo "Not a pull request merge: post-deploy checks are skipped."; fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # WCAG 2.2 AA check of the live site with axe-core. Runs after a merged pull request
  # is deployed, so it never blocks a site update; problems go to an "accessibility" issue.
  accessibility:
    needs: [deploy, merged-pr]
    if: needs.merged-pr.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Test tools only. The site build itself still has no dependencies.
      - name: Install test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.14.0
          npx playwright install --with-deps chromium

      - name: Check WCAG 2.2 AA
        continue-on-error: true
        run: node scripts/a11y.mjs "${{ needs.deploy.outputs.page_url }}"

      # Results go to a comment on the merged pull request (pass or fail), the run summary,
      # and, when there are problems, an "accessibility" issue that closes once they're fixed.
      - name: Post results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.merged-pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -f .cache/a11y-summary.md ]; then
            echo "::warning::The accessibility check did not run to completion; see the step above."
            gh pr comment "$PR" --body "Post-deploy accessibility check of commit ${GITHUB_SHA::7} didn't finish. See the [workflow run]($RUN_URL)."
            exit 0
          fi
          issue=""
          open=$(gh issue list --label "accessibility" --state open --json number --jq '.[0].number')
          if [ -s .cache/a11y-report.md ]; then
            if [ -z "$open" ]; then
              gh label create accessibility --color 8EB9FC --description "Automatic WCAG 2.2 AA check" 2>/dev/null || true
              issue=$(gh issue create --label accessibility --title "Accessibility problems found (WCAG 2.2 AA)" --body-file .cache/a11y-report.md)
            else
              gh issue edit "$open" --body-file .cache/a11y-report.md
              issue="#$open"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "The latest WCAG 2.2 AA check passed, so this is resolved."
          fi
          {
            echo "Post-deploy check of commit ${GITHUB_SHA::7}."
            echo
            cat .cache/a11y-summary.md
            if [ -n "$issue" ]; then echo; echo "Tracked in $issue."; fi
          } > .cache/a11y-comment.md
          cat .cache/a11y-comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body-file .cache/a11y-comment.md

  # Lighthouse performance check of the live site after a merged pull request is
  # deployed. Results go to the run summary and a comment on that pull request.
  lighthouse:
    needs: [deploy, merged-pr]
    if: needs.merged-pr.outputs.number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Test tool only; uses the Chrome already installed on GitHub's runners.
      - name: Install Lighthouse
        run: npm install --no-save --no-package-lock lighthouse@13.6.0

      - name: Run Lighthouse
        run: node scripts/lighthouse.mjs "${{ needs.deploy.outputs.page_url }}"

      - name: Post results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.merged-pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s .cache/lighthouse-report.md ]; then
            echo "::warning::Lighthouse produced no report; see the step above."
            gh pr comment "$PR" --body "Post-deploy Lighthouse check of commit ${GITHUB_SHA::7} didn't finish. See the [workflow run]($RUN_URL)."
            exit 0
          fi
          { echo "Post-deploy check of commit ${GITHUB_SHA::7}."; echo; cat .cache/lighthouse-report.md; } > .cache/lighthouse-comment.md
          cat .cache/lighthouse-comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body-file .cache/lighthouse-comment.md
